<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Supervisor Panel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <h1 class="mb-4">🧑‍💼 Pending Help Requests</h1>

    {% for req in help_requests if req.status == 'pending' %}
    <div class="card mb-3">
      <div class="card-body">
        <h5 class="card-title">❓ {{ req.question }}</h5>
        <form action="/submit_answer" method="post" class="d-flex gap-2">
          <input type="hidden" name="request_id" value="{{ req.id }}">
          <input type="text" name="answer" class="form-control" placeholder="Enter your answer" required>
          <button type="submit" class="btn btn-success">Submit</button>
        </form>
      </div>
    </div>
    {% else %}
      <div class="alert alert-info">No pending help requests.</div>
    {% endfor %}

    <a href="/learned" class="btn btn-outline-primary mt-3">View Learned Answers</a>
  </div>
</body>
</html>
